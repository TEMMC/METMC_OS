name: Build METMC OS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Verify project
        run: |
          echo "===== PROJECT ====="
          find . -maxdepth 4 -type f | sort
          echo "===== MANIFEST ====="
          cat app/src/main/AndroidManifest.xml
          echo "===== JAVA ====="
          sed -n '1,400p' app/src/main/java/com/metmc/os/MainActivity.java

      - name: Build METMC OS
        run: |
          gradle clean assembleDebug --stacktrace --no-daemon --warning-mode all

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: METMC-OS-debug
          path: app/build/outputs/apk/debug/*.apk
