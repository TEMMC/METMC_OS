name: Build METMC OS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager --licenses < <(printf 'y\n%.0s' {1..50}) || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-29" \
            "build-tools;34.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Build
        shell: bash
        run: |
          set +e

          gradle clean assembleDebug --stacktrace > build.log 2>&1
          BUILD_STATUS=$?

          echo "========== COMPILER ERRORS =========="

          grep -nEi \
            '(^e: file:|^e: |^error: |unresolved reference|type mismatch|expecting|cannot access|overload resolution|conflicting overloads)' \
            build.log | head -100 || true

          echo ""
          echo "========== LAST 150 BUILD LINES =========="

          tail -150 build.log || true

          exit $BUILD_STATUS

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: METMC-OS-build-log
          path: build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: METMC-OS-debug
          path: app/build/outputs/apk/debug/*.apk
