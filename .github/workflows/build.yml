name: Build METMC OS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager --licenses < <(printf 'y\n%.0s' {1..50}) || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-29" \
            "build-tools;34.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Build and show actual errors
        shell: bash
        run: |
          set +e

          gradle clean assembleDebug --stacktrace > build.log 2>&1
          BUILD_STATUS=$?

          echo "========== BUILD ERROR LOCATIONS =========="

          grep -nEi 'error:|\.java:[0-9]+:|\.kt:[0-9]+:|Execution failed for task|FAILURE: Build failed|BUILD FAILED' build.log | head -100 || true

          echo ""
          echo "========== FIRST ERROR CONTEXT =========="

          ERROR_LINE=$(grep -nEi 'error:|\.java:[0-9]+:|\.kt:[0-9]+:' build.log | head -1 | cut -d: -f1)

          if [ -n "$ERROR_LINE" ]; then
            START=$((ERROR_LINE - 15))
            [ "$START" -lt 1 ] && START=1
            END=$((ERROR_LINE + 60))
            sed -n "${START},${END}p" build.log
          else
            echo "No direct compiler error found."
            grep -nEi -B10 -A30 'Execution failed for task|What went wrong|Caused by:' build.log | head -200 || true
          fi

          echo ""
          echo "========== FAILED TASK =========="

          grep -nE '> Task .* FAILED|Execution failed for task' build.log | head -30 || true

          echo ""
          echo "========== LAST 120 LINES =========="

          tail -120 build.log || true

          exit $BUILD_STATUS

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: METMC-OS-build-log
          path: build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: METMC-OS-debug
          path: app/build/outputs/apk/debug/*.apk
