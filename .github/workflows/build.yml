name: Build METMC OS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager --licenses < <(printf 'y\ny\ny\ny\ny\ny\ny\ny\ny\ny\ny\ny\n') || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-29" \
            "build-tools;34.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build and capture full log
        shell: bash
        run: |
          set -o pipefail
          ./gradlew clean assembleDebug \
            --stacktrace \
            --info \
            2>&1 | tee build.log

      - name: Show compiler errors
        if: always()
        shell: bash
        run: |
          echo "========== ACTUAL COMPILER ERRORS =========="
          grep -nEi -B5 -A15 \
            '(^e: |^error: |unresolved reference|type mismatch|expecting|cannot access|overload resolution|conflicting overloads|Compilation error)' \
            build.log | tail -400 || true

          echo ""
          echo "========== LAST 200 LINES =========="
          tail -200 build.log || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: METMC-OS-build-log
          path: build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: METMC-OS-debug
          path: app/build/outputs/apk/debug/*.apk
