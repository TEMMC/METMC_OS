name: Build METMC OS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: metmc-os-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build
        run: |
          set -o pipefail
          echo "===== METMC OS BUILD START ====="
          gradle clean assembleDebug --stacktrace --info --console=plain --warning-mode all 2>&1 | tee build.log
          status=${PIPESTATUS[0]}

          echo
          echo "===== ACTUAL COMPILER ERRORS ====="
          if [ "$status" -ne 0 ]; then
            grep -nEi '(^|[[:space:]])(e:|error:|unresolved reference|type mismatch|expecting|cannot access|conflicting overloads|compilation error|CompilationErrorException|FAILED)' build.log || true
          else
            echo "No compiler errors."
          fi

          echo
          echo "===== BUILD RESULT ====="
          if [ "$status" -ne 0 ]; then
            echo "BUILD FAILED"
            exit "$status"
          fi
          echo "BUILD SUCCESSFUL"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: METMC-OS-debug
          path: app/build/outputs/apk/debug/*.apk
