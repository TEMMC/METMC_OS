name: Build METMC OS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager --licenses < <(printf 'y\ny\ny\ny\ny\ny\ny\ny\ny\ny\ny\ny\n') || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-29" \
            "build-tools;34.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Build
        shell: bash
        run: |
          set +e
          gradle clean assembleDebug --stacktrace 2>&1 | tee build.log
          BUILD_STATUS=${PIPESTATUS[0]}
          echo ""
          echo "========== FIRST COMPILER ERRORS =========="
          grep -nEi -B5 -A15 '(^e: file:|^e: |error:|unresolved reference|type mismatch|expecting|cannot access|overload resolution|conflicting overloads)' build.log | head -300 || true
          echo ""
          echo "========== LAST 400 BUILD LINES =========="
          tail -400 build.log || true
          exit $BUILD_STATUS

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: METMC-OS-debug
          path: app/build/outputs/apk/debug/*.apk
