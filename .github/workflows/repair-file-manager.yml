name: Repair METMC file manager build

on:
  push:
    branches:
      - x11-native
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair malformed Kotlin block
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/metmc/os/desktop/MetmcFileManagerView.kt')
          lines = p.read_text().splitlines()
          out = []
          changed = False
          for line in lines:
              if 'Thread { runRoot(if (tab == Tab.LINUX)' in line:
                  indent = line[:len(line) - len(line.lstrip())]
                  out.extend([
                      indent + 'Thread {',
                      indent + '    val target = "$base/$n"',
                      indent + '    val command = if (tab == Tab.LINUX) {',
                      indent + '        "chroot /data/local/linux/rootfs /bin/mkdir -p ${q(target)}"',
                      indent + '    } else {',
                      indent + '        "mkdir -p ${q(target)}"',
                      indent + '    }',
                      indent + '    runRoot(command)',
                      indent + '    (context as? Activity)?.runOnUiThread { refresh() }',
                      indent + '}.start()'
                  ])
                  changed = True
              else:
                  out.append(line)
          if changed:
              p.write_text('\n'.join(out) + '\n')
          print('File manager repair applied:', changed)
          PY

      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No repair needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/metmc/os/desktop/MetmcFileManagerView.kt
          git commit -m "Fix METMC file manager Kotlin syntax error"
          git push
