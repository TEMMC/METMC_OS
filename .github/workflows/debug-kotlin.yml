name: Debug Kotlin

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: metmc-os-main
  cancel-in-progress: true

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Show project
        run: |
          echo "===== PROJECT ====="
          ls -la
          echo "===== GRADLE FILES ====="
          find . -maxdepth 2 -type f \( -name 'gradlew' -o -name 'build.gradle*' -o -name 'settings.gradle*' \) -print

      - name: Build Kotlin
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin --stacktrace --info 2>&1 | tee kotlin-build.log
          echo "===== COMPILER ERRORS ====="
          echo "===== ACTUAL FAILURE ====="
grep -nEi -B5 -A12 'e: |error:|unresolved reference|expecting|type mismatch|overload resolution|caused by:|what went wrong|execution failed' kotlin-build.log | tail -250 || true
echo "===== LAST 250 LOG LINES ====="
tail -250 kotlin-build.log
