name: METMC OS Release

on:
  push:
    branches:
      - x11-native
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager --licenses < <(printf 'y\n%.0s' {1..50}) || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Verify signing secrets
        shell: bash
        env:
          METMC_STORE_PASSWORD: ${{ secrets.METMC_STORE_PASSWORD }}
          METMC_KEY_ALIAS: ${{ secrets.METMC_KEY_ALIAS }}
          METMC_KEY_PASSWORD: ${{ secrets.METMC_KEY_PASSWORD }}
          METMC_KEYSTORE_BASE64: ${{ secrets.METMC_KEYSTORE_BASE64 }}
        run: |
          set -e

          test -n "$METMC_STORE_PASSWORD" || {
            echo "::error::Missing METMC_STORE_PASSWORD"
            exit 1
          }

          test -n "$METMC_KEY_ALIAS" || {
            echo "::error::Missing METMC_KEY_ALIAS"
            exit 1
          }

          test -n "$METMC_KEY_PASSWORD" || {
            echo "::error::Missing METMC_KEY_PASSWORD"
            exit 1
          }

          test -n "$METMC_KEYSTORE_BASE64" || {
            echo "::error::Missing METMC_KEYSTORE_BASE64"
            exit 1
          }

      - name: Restore release keystore
        shell: bash
        env:
          METMC_KEYSTORE_BASE64: ${{ secrets.METMC_KEYSTORE_BASE64 }}
        run: |
          set -e

          echo "$METMC_KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/metmc-release.keystore"

          chmod 600 "$RUNNER_TEMP/metmc-release.keystore"

          test -s "$RUNNER_TEMP/metmc-release.keystore"

      - name: Build signed release
        shell: bash
        env:
          METMC_KEYSTORE_FILE: ${{ runner.temp }}/metmc-release.keystore
          METMC_STORE_PASSWORD: ${{ secrets.METMC_STORE_PASSWORD }}
          METMC_KEY_ALIAS: ${{ secrets.METMC_KEY_ALIAS }}
          METMC_KEY_PASSWORD: ${{ secrets.METMC_KEY_PASSWORD }}
        run: |
          set -e

          gradle clean assembleRelease \
            -PMETMC_VERSION_CODE=7 \
            -PMETMC_VERSION_NAME=7.0 \
            --stacktrace

      - name: Prepare release files
        shell: bash
        run: |
          set -e

          APK=$(find app/build/outputs/apk/release \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            | head -1)

          test -n "$APK"

          cp "$APK" metmc-os.apk

          sha256sum metmc-os.apk \
            > metmc-os.apk.sha256

          SHA256=$(cut -d' ' -f1 metmc-os.apk.sha256)

          cat > metmc-update.json <<EOF
          {
            "packageName": "com.metmc.os",
            "versionCode": 7,
            "versionName": "7.0",
            "sha256": "$SHA256",
            "apkUrl": "https://github.com/TEMMC/METMC_OS/releases/download/metmc-os-latest/metmc-os.apk"
          }
          EOF

          echo "Release SHA-256:"
          cat metmc-os.apk.sha256

          echo "Update manifest:"
          cat metmc-update.json

      - name: Publish METMC OS release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e

          gh release view metmc-os-latest >/dev/null 2>&1 && \
            gh release delete metmc-os-latest \
              --yes \
              --cleanup-tag || true

          gh release create metmc-os-latest \
            metmc-os.apk \
            metmc-os.apk.sha256 \
            metmc-update.json \
            --title "METMC OS 7.0" \
            --notes "METMC OS 7.0 automatic release."

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: METMC-OS-release
          path: |
            metmc-os.apk
            metmc-os.apk.sha256
            metmc-update.json

      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/metmc-release.keystore"
