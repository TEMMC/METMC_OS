name: METMC OS Release

on:
  push:
    branches:
      - x11-native
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --licenses < <(printf 'y\n%.0s' {1..50}) || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - name: Verify signing secrets
        shell: bash
        env:
          METMC_STORE_PASSWORD: ${{ secrets.METMC_STORE_PASSWORD }}
          METMC_KEY_ALIAS: ${{ secrets.METMC_KEY_ALIAS }}
          METMC_KEY_PASSWORD: ${{ secrets.METMC_KEY_PASSWORD }}
          METMC_KEYSTORE_BASE64: ${{ secrets.METMC_KEYSTORE_BASE64 }}
        run: |
          set -e
          test -n "$METMC_STORE_PASSWORD" || { echo "::error::Missing METMC_STORE_PASSWORD"; exit 1; }
          test -n "$METMC_KEY_ALIAS" || { echo "::error::Missing METMC_KEY_ALIAS"; exit 1; }
          test -n "$METMC_KEY_PASSWORD" || { echo "::error::Missing METMC_KEY_PASSWORD"; exit 1; }
          test -n "$METMC_KEYSTORE_BASE64" || { echo "::error::Missing METMC_KEYSTORE_BASE64"; exit 1; }
      - name: Restore release keystore
        shell: bash
        env:
          METMC_KEYSTORE_BASE64: ${{ secrets.METMC_KEYSTORE_BASE64 }}
          METMC_STORE_PASSWORD: ${{ secrets.METMC_STORE_PASSWORD }}
          METMC_KEY_ALIAS: ${{ secrets.METMC_KEY_ALIAS }}
          METMC_KEY_PASSWORD: ${{ secrets.METMC_KEY_PASSWORD }}
        run: |
          set -e
          mkdir -p android/signing
          echo "$METMC_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/metmc-release.keystore"
          chmod 600 "$RUNNER_TEMP/metmc-release.keystore"
          cat > android/signing/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/metmc-release.keystore
          storePassword=$METMC_STORE_PASSWORD
          keyAlias=$METMC_KEY_ALIAS
          keyPassword=$METMC_KEY_PASSWORD
          EOF
      - name: Build signed release with dependency retries
        shell: bash
        run: |
          set +e
          BUILD_STATUS=1
          for attempt in 1 2 3 4; do
            echo "========== RELEASE BUILD ATTEMPT $attempt/4 =========="
            rm -f release-build.log
            (cd android && ./gradlew --no-daemon --stacktrace --refresh-dependencies clean assembleRelease -PMETMC_VERSION_CODE=12 -PMETMC_VERSION_NAME=8.5) > release-build.log 2>&1
            BUILD_STATUS=$?
            if [ "$BUILD_STATUS" -eq 0 ]; then break; fi
            if [ "$attempt" -lt 4 ]; then
              echo "Release build attempt $attempt failed; clearing failed dependency metadata and retrying."
              rm -rf "$HOME/.gradle/caches/modules-2/files-2.1" "$HOME/.gradle/caches/modules-2/metadata-*" 2>/dev/null || true
              sleep 10
            fi
          done
          grep -nEi 'error:|\.java:[0-9]+:|\.kt:[0-9]+:|Could not find|Could not GET|Could not resolve|Execution failed for task|FAILURE: Build failed|BUILD FAILED' release-build.log | head -160 || true
          tail -160 release-build.log || true
          exit $BUILD_STATUS
      - name: Prepare release files
        shell: bash
        run: |
          set -e
          APK=$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -1)
          test -n "$APK"
          cp "$APK" metmc-os.apk
          sha256sum metmc-os.apk > metmc-os.apk.sha256
          SHA256=$(cut -d' ' -f1 metmc-os.apk.sha256)
          cat > metmc-update.json <<EOF
          {
            "packageName": "com.metmc.os",
            "versionCode": 12,
            "versionName": "8.5",
            "sha256": "$SHA256",
            "apkUrl": "https://github.com/TEMMC/METMC_OS/releases/download/metmc-os-latest/metmc-os.apk"
          }
          EOF
          echo "Release SHA-256:"; cat metmc-os.apk.sha256
          echo "Update manifest:"; cat metmc-update.json
      - name: Publish METMC OS release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          gh release view metmc-os-latest >/dev/null 2>&1 && gh release delete metmc-os-latest --yes --cleanup-tag || true
          gh release create metmc-os-latest metmc-os.apk metmc-os.apk.sha256 metmc-update.json --title "METMC OS 8.5" --notes "METMC OS 8.5 built from the NativOS-derived Android/Phosh foundation."
      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: METMC-OS-release
          path: |
            metmc-os.apk
            metmc-os.apk.sha256
            metmc-update.json
            release-build.log
      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/metmc-release.keystore"
          rm -f android/signing/keystore.properties
