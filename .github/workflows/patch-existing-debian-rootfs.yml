name: Patch existing Debian rootfs detection

on:
  push:
    branches: [x11-native]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Fix reuse of existing Debian rootfs'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: x11-native
          fetch-depth: 0

      - name: Patch rootfs reuse
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          rootfs = Path('android/app/src/main/java/com/metmc/os/runtime/RootfsManager.kt')
          text = rootfs.read_text()

          old = '''        private const val BUNDLED_ROOTFS_ASSET = "rootfs/metmc-rootfs-arm64.tgz"\n'''
          new = '''        private const val BUNDLED_ROOTFS_ASSET = "rootfs/metmc-rootfs-arm64.tgz"\n        private const val EXISTING_DEBIAN_ROOTFS = "/data/local/linux/rootfs"\n'''
          if old not in text:
              raise SystemExit('RootfsManager constant anchor not found')
          text = text.replace(old, new, 1)

          old = '''    fun isRootfsReady(): Boolean =\n        rootfsDir.exists() && File(rootfsDir, "bin").exists() &&\n        File(rootfsDir, "usr").exists() && File(rootfsDir, "etc").exists()\n'''
          new = '''    fun isRootfsReady(): Boolean =\n        (rootfsDir.exists() && File(rootfsDir, "bin").exists() &&\n            File(rootfsDir, "usr").exists() && File(rootfsDir, "etc").exists()) ||\n            hasExistingDebianRootfs()\n\n    /**\n     * Detect a Debian rootfs that was already installed outside METMC OS.\n     * This probe runs through su because /data/local/linux/rootfs is normally\n     * protected from the Android app UID. Nothing is copied or overwritten.\n     */\n    fun hasExistingDebianRootfs(): Boolean {\n        return try {\n            val process = ProcessBuilder(\n                "su", "-c",\n                "test -d $EXISTING_DEBIAN_ROOTFS && " +\n                    "test -f $EXISTING_DEBIAN_ROOTFS/etc/os-release && " +\n                    "test -f $EXISTING_DEBIAN_ROOTFS/etc/debian_version && " +\n                    "test -x $EXISTING_DEBIAN_ROOTFS/usr/bin/bash"\n            ).redirectErrorStream(true).start()\n            process.waitFor() == 0\n        } catch (error: Throwable) {\n            Log.w(TAG, "Could not probe existing Debian rootfs", error)\n            false\n        }\n    }\n'''
          if old not in text:
              raise SystemExit('RootfsManager readiness anchor not found')
          text = text.replace(old, new, 1)
          rootfs.write_text(text)

          chroot = Path('android/app/src/main/java/com/metmc/os/runtime/ChrootManager.kt')
          text = chroot.read_text()

          old = '''    private val baseDir: File get() = context.filesDir\n    private val rootfsDir: File get() = File(baseDir, "rootfs")\n'''
          new = '''    private val baseDir: File get() = context.filesDir\n    private var rootfsDir: File = File(baseDir, "rootfs")\n'''
          if old not in text:
              raise SystemExit('ChrootManager rootfs anchor not found')
          text = text.replace(old, new, 1)

          anchor = '''    private val rootShell = RootShell(context)\n\n'''
          addition = '''    private val rootShell = RootShell(context)\n\n    /**\n     * Reuse the device-wide Debian installation when one already exists.\n     * The existing tree is selected in place; METMC OS never deletes or\n     * replaces it with a newly downloaded archive.\n     */\n    fun adoptExistingDebianRootfs(): Boolean {\n        if (!hasRoot()) return false\n        val existing = File("/data/local/linux/rootfs")\n        val probe = rootShell.exec(\n            "test -d ${existing.absolutePath} && " +\n                "test -f ${existing.absolutePath}/etc/os-release && " +\n                "test -f ${existing.absolutePath}/etc/debian_version && " +\n                "test -x ${existing.absolutePath}/usr/bin/bash && " +\n                "echo METMC_EXISTING_DEBIAN_ROOTFS"\n        )\n        if (!probe.contains("METMC_EXISTING_DEBIAN_ROOTFS")) return false\n        rootfsDir = existing\n        Log.i(TAG, "Reusing existing Debian rootfs at ${existing.absolutePath}")\n        return true\n    }\n\n'''
          if anchor not in text:
              raise SystemExit('ChrootManager root shell anchor not found')
          text = text.replace(anchor, addition, 1)
          chroot.write_text(text)

          kiosk = Path('android/app/src/main/java/com/metmc/os/launcher/KioskActivity.kt')
          text = kiosk.read_text()
          old = '''            waitingForRoot = false\n            SharedFolderSync.start(this)\n'''
          new = '''            waitingForRoot = false\n            val reusedExistingRootfs = chrootManager.adoptExistingDebianRootfs()\n            if (reusedExistingRootfs) {\n                updateOverlay(0.04, "Existing Debian rootfs found", "Reusing /data/local/linux/rootfs — no new download")\n            }\n            SharedFolderSync.start(this)\n'''
          if old not in text:
              raise SystemExit('KioskActivity root confirmation anchor not found')
          text = text.replace(old, new, 1)
          kiosk.write_text(text)
          PY

          git diff --check
          git status --short

      - name: Commit and remove patch workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/java/com/metmc/os/runtime/RootfsManager.kt \
                  android/app/src/main/java/com/metmc/os/runtime/ChrootManager.kt \
                  android/app/src/main/java/com/metmc/os/launcher/KioskActivity.kt
          git rm .github/workflows/patch-existing-debian-rootfs.yml
          git commit -m "Fix reuse of existing Debian rootfs"
          git push origin HEAD:x11-native
