plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def metmcVersionCode = (providers.gradleProperty("METMC_VERSION_CODE").getOrElse("7")).toInteger()
def metmcVersionName = providers.gradleProperty("METMC_VERSION_NAME").getOrElse("7.0")

android {
    namespace 'com.metmc.os'
    compileSdk 35

    defaultConfig {
        applicationId 'com.metmc.os'
        minSdk 23
        targetSdk 35
        versionCode metmcVersionCode
        versionName metmcVersionName

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        release {
            def ks = System.getenv("METMC_KEYSTORE_FILE")
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("METMC_STORE_PASSWORD")
                keyAlias System.getenv("METMC_KEY_ALIAS")
                keyPassword System.getenv("METMC_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }

        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig = true
        aidl = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
}


android {
    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
        }
    }
}
